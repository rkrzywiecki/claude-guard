# claude-guard policy.
#
# Every category has:
#   enabled            turn the category on or off
#   action             allow | warn | redact | block (redact is only valid for secrets)
#   threshold          minimum detector confidence (0..1) to apply `action`;
#                      findings below it are downgraded to `warn`
#   min_severity       low | medium | high | critical; findings below are ignored
#   direction_actions  optional per-direction override of `action`
#                      (directions: request, response, tool_input, tool_output)
#
# The verdict for a payload is the strictest action across all findings:
# block > redact > warn > allow.
version: 1

secrets:
  enabled: true
  action: redact
  threshold: 0.5
  min_severity: low
  direction_actions: {}
  # Generic high-entropy strings: minimum length and Shannon entropy (bits per char).
  entropy_min_length: 24
  entropy_threshold: 4.0
  # Regexes for values that are safe to ignore (example keys from vendor documentation).
  allowlist:
    - "AKIAIOSFODNN7EXAMPLE"
    - "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

prompt_injection:
  enabled: true
  action: block
  threshold: 0.7
  min_severity: low
  # Example: only warn about injection found in tool results instead of blocking.
  # direction_actions:
  #   tool_output: warn
  direction_actions: {}
  # MCP tool definitions (tool poisoning): off | warn (findings capped at warn) | block.
  tool_definitions: warn

dangerous_commands:
  enabled: true
  action: block
  threshold: 0.7
  min_severity: low
  direction_actions: {}
  # Regexes for commands that are always allowed.
  allowlist: []

data_exfiltration:
  enabled: true
  action: block
  threshold: 0.6
  min_severity: low
  direction_actions: {}
  # Hosts that tools may send data to (uploads, piped data, scp/rsync) without being flagged;
  # subdomains included. Empty by default: well-known services are exfiltration channels too
  # (a Files API upload with someone else's key, a public gist). Example:
  # allowed_hosts: [uploads.github.com, internal.example.com]
  allowed_hosts: []

tools:
  # Which tools may be called, by name glob (Bash, WebFetch, mcp__github__*). Checked for tool
  # calls about to run (hooks) and tool_use blocks in responses (proxy).
  enabled: true
  action: block
  threshold: 0.5
  min_severity: low
  direction_actions: {}
  # Always denied.
  deny: []
  # When non-empty, only these tools are allowed (list Claude Code's built-in tools too).
  allow: []
  # Allowed, but every call is reported as a warning.
  warn: []

llm_judge:
  # Uses the model from GUARD_JUDGE_MODEL and ANTHROPIC_API_KEY. Adds cost and latency.
  enabled: false
  action: block
  threshold: 0.8
  min_severity: low
  direction_actions: {}
  # always:    judge every payload;
  # untrusted: judge when the content includes untrusted data (tool results, fetched documents:
  #            where indirect injection lives), and otherwise as in uncertain mode;
  # uncertain: only when the strongest heuristic confidence falls inside uncertain_range.
  mode: untrusted
  uncertain_range: [0.3, 0.7]
  timeout_seconds: 10.0
  max_retries: 2
  # Longer content is truncated before being sent to the judge.
  max_input_chars: 50000

# Your own regex rules. Each uses the action, threshold and direction_actions of its category
# (secrets | prompt_injection | dangerous_commands | data_exfiltration); secrets rules redact
# the match. Optional filters: directions, tools (globs), fields, untrusted_only, ignore_case.
# Example:
# custom_rules:
#   - name: internal_hostname
#     description: Internal production hostname
#     category: secrets
#     pattern: '\bdb-prod-\d+\.corp\.example\b'
#     severity: medium
#   - name: no_kubectl_prod
#     description: kubectl against the production context
#     category: dangerous_commands
#     pattern: '\bkubectl\b.*--context[= ]prod'
#     tools: [Bash]
#     fields: [command]
custom_rules: []
