[project]
name = "claude-guard"
version = "0.1.0"
description = "Security guard for Claude: inspects outgoing context and responses via an API proxy or Claude Code hooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claude-guard = "claude_guard.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "trustme>=1.2.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["claude_guard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
